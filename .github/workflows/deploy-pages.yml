name: Publikacja GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v6
      - name: Przygotuj Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Zainstaluj zależności
        run: npm install --no-audit --no-fund
      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5
      - name: Zbuduj wersję statyczną
        run: npm run build:pages
      - name: Prześlij artefakt strony
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Opublikuj stronę
        id: deployment
        uses: actions/deploy-pages@v4
